spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:momogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
      hibernate.jdbc.log.errors: true

logging:
  level:
    com.mogumogu.momogo: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: WARN
    org.hibernate.orm.jdbc.bind: TRACE

momogo:
  event:
    discord:
      webhook-url: ${SERVICE_EVENT_DISCORD_WEBHOOK_URL:https://discord.com/api/webhooks/0/not-configured}
  report:
    discord:
      webhook-url: ${PHOTO_REPORT_DISCORD_WEBHOOK_URL:https://discord.com/api/webhooks/0/not-configured}
  storage:
    r2:
      endpoint: ${R2_ENDPOINT:https://00000000000000000000000000000000.r2.cloudflarestorage.com}
      bucket: ${R2_BUCKET:momogo-local}
      access-key-id: ${R2_ACCESS_KEY_ID:local-access-key-id}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:local-secret-access-key}
  app-version:
    ios:
      latest-version: 1.0.0
      min-supported-version: 1.0.0
      update-url: https://apps.apple.com/app/id000000000
    android:
      latest-version: 1.0.0
      min-supported-version: 1.0.0
      update-url: https://play.google.com/store/apps/details?id=com.mogumogu.momogo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
