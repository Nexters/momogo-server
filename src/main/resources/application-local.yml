spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:momogo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.mogumogu.momogo: DEBUG

momogo:
  app-version:
    ios:
      latest-version: 1.3.0
      min-supported-version: 1.1.0
      update-url: https://apps.apple.com/app/id000000000
    android:
      latest-version: 1.3.0
      min-supported-version: 1.1.0
      update-url: https://play.google.com/store/apps/details?id=com.mogumogu.momogo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
