spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:momogo}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:momogo}
    password: ${DB_PASSWORD:momogo}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.mogumogu.momogo: DEBUG
