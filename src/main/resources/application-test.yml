spring:
  config:
    activate:
      on-profile: test
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:momogo-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

logging:
  level:
    root: WARN

momogo:
  storage:
    r2:
      endpoint: https://00000000000000000000000000000000.r2.cloudflarestorage.com
      bucket: momogo-test
      access-key-id: test-access-key-id
      secret-access-key: test-secret-access-key
  app-version:
    ios:
      latest-version: 1.0.0
      min-supported-version: 1.0.0
      update-url: https://apps.apple.com/app/id000000000
    android:
      latest-version: 1.0.0
      min-supported-version: 1.0.0
      update-url: https://play.google.com/store/apps/details?id=com.mogumogu.momogo
  security:
    jwt:
      issuer: momogo-server-test
      # test 프로필에서만 사용하는 32바이트 테스트 비밀값
      secret-base64: bW9tb2dvLXRlc3Qtand0LXNlY3JldC0zMi1ieXRlcyEhISE=
