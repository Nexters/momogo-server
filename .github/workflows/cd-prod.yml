name: CD / prod

on:
  workflow_run:
    workflows: ["CI"]
    branches: ['release/**']
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA (leave blank for HEAD)
        required: false
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    env:
      IMAGE_REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_REVISION }}

      - name: Checkout notification script
        uses: actions/checkout@v6
        with:
          ref: main
          sparse-checkout: scripts
          path: notification-source

      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: deploy/compose.prod.yml,scripts/deploy.sh
          target: /opt/momogo/deploy/prod
          overwrite: true

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: IMAGE_REVISION,GHCR_TOKEN,GHCR_ACTOR
          script: |
            cd /opt/momogo/deploy/prod
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh prod "$IMAGE_REVISION"

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: ./notification-source/scripts/notify-deployment.sh prod "$IMAGE_REVISION" "$SOURCE_BRANCH"

      - name: Tag deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deploy/prod/$(TZ=Asia/Seoul date +%Y%m%d-%H%M%S)"
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="$IMAGE_REVISION"
          echo "배포 태그를 생성했습니다: ${tag}"
