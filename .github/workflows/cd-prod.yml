name: CD / prod

on:
  workflow_run:
    workflows: ["CI"]
    branches: ['release/**']
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA (leave blank for HEAD)
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    env:
      IMAGE_REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          ref: ${{ env.IMAGE_REVISION }}

      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          source: deploy/compose.prod.yml,scripts/deploy.sh
          target: /opt/momogo/deploy/prod
          overwrite: true

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          envs: IMAGE_REVISION,GHCR_TOKEN,GHCR_ACTOR
          script: |
            cd /opt/momogo/deploy/prod
            chmod +x ./scripts/deploy.sh
            ./scripts/deploy.sh prod "$IMAGE_REVISION"
