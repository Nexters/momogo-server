name: CD / prod

on:
  workflow_run:
    workflows: ["CI"]
    branches: ['release/**']
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA (leave blank for HEAD)
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: cd-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    env:
      IMAGE_REVISION: ${{ inputs.revision || github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Configure image repository
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_REPOSITORY,IMAGE_REVISION,GHCR_TOKEN,GHCR_ACTOR
          script: |
            CONFIG_DIR="/opt/momogo/config/prod"
            CONTAINER_NAME="momogo-prod"
            HEALTH_URL="http://localhost:8080/actuator/health"

            if [ ! -f "${CONFIG_DIR}/application-prod.yml" ]; then
              echo "오류: 설정 파일 없음 — ${CONFIG_DIR}/application-prod.yml" >&2
              exit 1
            fi

            PREV_TAG=""
            if docker ps -a --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
              PREV_IMAGE=$(docker inspect --format '{{.Config.Image}}' "${CONTAINER_NAME}")
              PREV_TAG="${PREV_IMAGE##*:}"
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker pull "${IMAGE_REPOSITORY}:${IMAGE_REVISION}"

            if docker ps -a --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
              docker stop "${CONTAINER_NAME}" > /dev/null
              docker rm "${CONTAINER_NAME}" > /dev/null
            fi

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_CONFIG_ADDITIONAL_LOCATION="file:/config/" \
              -v "${CONFIG_DIR}:/config:ro" \
              "${IMAGE_REPOSITORY}:${IMAGE_REVISION}"

            for i in $(seq 1 30); do
              if curl -sf "${HEALTH_URL}" | grep -q '"status":"UP"'; then
                echo "헬스체크 성공 (${i}회차)"
                docker image prune -f > /dev/null
                exit 0
              fi
              echo "헬스체크 대기 중... (${i}/30)"
              sleep 3
            done

            echo "헬스체크 실패. 최근 로그:" >&2
            docker logs --tail 50 "${CONTAINER_NAME}" || true

            if [ -n "${PREV_TAG}" ]; then
              echo "이전 태그로 롤백: ${PREV_TAG}"
              docker stop "${CONTAINER_NAME}" > /dev/null 2>&1 || true
              docker rm "${CONTAINER_NAME}" > /dev/null 2>&1 || true
              docker run -d \
                --name "${CONTAINER_NAME}" \
                --restart unless-stopped \
                -p 8080:8080 \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e SPRING_CONFIG_ADDITIONAL_LOCATION="file:/config/" \
                -v "${CONFIG_DIR}:/config:ro" \
                "${IMAGE_REPOSITORY}:${PREV_TAG}"
              for i in $(seq 1 30); do
                if curl -sf "${HEALTH_URL}" | grep -q '"status":"UP"'; then
                  echo "롤백 완료. 서비스는 ${PREV_TAG}로 복구됨"
                  exit 1
                fi
                sleep 3
              done
              echo "경고: 롤백 후에도 헬스체크 실패. 수동 확인 필요" >&2
            fi

            exit 1
